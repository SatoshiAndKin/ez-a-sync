---
name: MyPy
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["**"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  mypy:
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        pyversion:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup Python (faster than using Python container)
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.pyversion }}"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          pyproject.toml
    - name: Update pip
      run: python -m pip install --upgrade pip
    - name: Install dev dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Install ez-a-sync and its mypy plugin
      run: python -m pip install -e .
    - name: Run MyPy
      run: mypy
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (mypy.yaml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["mypy"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  pull_request: {}
