name: CodeQL
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_INCLUDE_PATHS: '["**.py","**/codeql-analysis.yml"]'
          CI_IGNORE_PATHS: "[]"
        run: python3 .github/scripts/ci_changes.py
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
    needs:
      - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (codeql.yaml)
    if: ${{ !cancelled() }}
    needs:
      - ci_changes
      - analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify validation contract
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["analyze"]'
        run:
          "python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

          python3 .github/scripts/ci_gate.py"
"on":
  push:
    branches:
      - master
      - dev
    paths:
      - "**.py"
      - "**/codeql-analysis.yml"
  pull_request:
    branches:
      - master
      - dev
    paths:
      - "**"
